spring:
  application:
    name: splitwise

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:splitwise_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:/db/changelog/changelog-master.yml
    enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

notification:
  enabled: ${NOTIFICATION_ENABLED:true}
  base-url: ${NOTIFICATION_BASE_URL:http://localhost:8090}
  internal-api-key: ${NOTIFICATION_INTERNAL_API_KEY}

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: WARN
    com.splitwise: ${LOG_LEVEL:INFO}
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

jwt:
  # No default on purpose: the app must fail to start rather than run with a publicly known secret.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
