spring:
  application:
    name: splitwise
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:splitwise_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.yml
    enabled: true
  
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${APP_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: WARN
    com.splitwise: DEBUG
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

jwt:
  secret: ${JWT_SECRET:your_super_secure_jwt_key_that_is_at_least_512_bits_long_for_hs512_algorithm_please_change_this_in_production_12345}
  expiration: ${JWT_EXPIRATION:86400000}
